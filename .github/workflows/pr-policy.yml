# Reusable gate-ratchet job. Caller must trigger on pull_request_target and
# pass through the PR event context. Workflow + script execute from the PR
# *base* ref only; head is fetched as git objects and parsed as data.
name: pr-policy

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '22'
      pnpm-version:
        type: string
        required: false
        default: '10.28.0'

permissions:
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base ref only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      # Absolute ref: reusable workflows resolve `./` against the *caller* repo.
      - name: Setup Node and pnpm
        uses: Bassov/ts-agent-rig/.github/actions/setup-node-pnpm@v0.2.1
        with:
          node-version: ${{ inputs.node-version }}
          pnpm-version: ${{ inputs.pnpm-version }}
          install: 'true'

      # Full head history (no --depth): merge-base needs the fork point.
      - name: Fetch head as data (works for forks)
        run: |
          git fetch --no-tags origin \
            pull/${{ github.event.pull_request.number }}/head:refs/gate-ratchet/head

      # Compare the fork point, not the base tip: files main added after the
      # fork are absent from head but were never deleted by the PR.
      - name: Gate ratchet (base script vs head tree)
        env:
          PR_POLICY_BODY: ${{ github.event.pull_request.body }}
          PR_POLICY_BRANCH: ${{ github.head_ref }}
          PR_POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MB=$(git merge-base "$PR_POLICY_BASE_SHA" refs/gate-ratchet/head)
          pnpm exec ts-rig-gate pr-policy \
            --base-ref "$MB" \
            --head-ref refs/gate-ratchet/head \
            --pr-body-env PR_POLICY_BODY

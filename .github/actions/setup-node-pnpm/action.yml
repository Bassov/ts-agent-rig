name: setup-node-pnpm
description: >-
  Install pnpm and Node, optionally run pnpm install --frozen-lockfile.
  Does not check out the repo — hosts keep custom fetch-depth / base-ref.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
  pnpm-version:
    description: pnpm version for pnpm/action-setup
    required: false
    default: '10.28.0'
  install:
    description: Run pnpm install --frozen-lockfile after setup
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
